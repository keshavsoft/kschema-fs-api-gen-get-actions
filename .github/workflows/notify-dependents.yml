name: Notify Dependents

on:
  workflow_call:
    secrets:
      REPO_DISPATCH_TOKEN:
        required: true
  workflow_dispatch:

jobs:
  notify-dependents:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for NPM registry replication
        run: sleep 15
      - name: Notify Dependent Repositories
        run: |
          echo "### 🔔 Dependency Notification Status" >> $GITHUB_STEP_SUMMARY

          RESPONSE1=$(curl -s -w "%{http_code}" -o resp1.json -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.REPO_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/keshavsoft/vs-code-ext-express-api-gen-get-actions/dispatches \
            -d '{"event_type":"dependency-updated"}')

          if [ "$RESPONSE1" = "204" ]; then
            echo "* **[keshavsoft/vs-code-ext-express-api-gen-get-actions](https://github.com/keshavsoft/vs-code-ext-express-api-gen-get-actions/actions)**: ✅ Dispatched successfully (HTTP 204)" >> $GITHUB_STEP_SUMMARY
          else
            echo "* **[keshavsoft/vs-code-ext-express-api-gen-get-actions](https://github.com/keshavsoft/vs-code-ext-express-api-gen-get-actions/actions)**: ❌ Failed to dispatch (HTTP $RESPONSE1)" >> $GITHUB_STEP_SUMMARY
            cat resp1.json >> $GITHUB_STEP_SUMMARY
          fi

          RESPONSE2=$(curl -s -w "%{http_code}" -o resp2.json -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.REPO_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/keshavsoft/vs-code-ext-from-any-js/dispatches \
            -d '{"event_type":"dependency-updated","client_payload":{"package":"kschema-fs-api-gen-get-actions"}}')

          if [ "$RESPONSE2" = "204" ]; then
            echo "* **[keshavsoft/vs-code-ext-from-any-js](https://github.com/keshavsoft/vs-code-ext-from-any-js/actions)**: ✅ Dispatched successfully (HTTP 204)" >> $GITHUB_STEP_SUMMARY
          else
            echo "* **[keshavsoft/vs-code-ext-from-any-js](https://github.com/keshavsoft/vs-code-ext-from-any-js/actions)**: ❌ Failed to dispatch (HTTP $RESPONSE2)" >> $GITHUB_STEP_SUMMARY
            cat resp2.json >> $GITHUB_STEP_SUMMARY
          fi

